
<style>
@keyframes spin{to{transform:rotate(360deg)}}
.fan-blades{transform-origin:340px 110px;animation:spin var(--spd,2s) linear infinite}
.toggle-track{position:relative;width:32px;height:18px;background:var(--color-border-secondary);border-radius:9px}
</style>
<svg width="100%" viewBox="0 0 680 320" role="img">
  <title>PWM duty cycle controlling fan speed</title>
  <desc>A square wave showing high and low pulses at varying duty cycle, connected to an animated fan that spins faster as the duty cycle increases</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <text class="ts" x="40" y="30">Arduino pin voltage over time</text>
  <line x1="40" y1="40" x2="40" y2="100" stroke="var(--t)" stroke-width="0.5" opacity=".4"/>
  <line x1="40" y1="100" x2="270" y2="100" stroke="var(--t)" stroke-width="0.5" opacity=".4"/>
  <text class="ts" x="36" y="48" text-anchor="end">5V</text>
  <text class="ts" x="36" y="98" text-anchor="end">0V</text>

  <path id="pwmpath" fill="none" stroke="#EF9F27" stroke-width="2" stroke-linecap="round" d="M40,48 L75,48 L75,98 L110,98 L110,48 L145,48 L145,98 L180,98 L180,48 L215,48 L215,98 L250,98"/>

  <line x1="270" y1="20" x2="270" y2="280" stroke="var(--t)" stroke-width="0.5" opacity=".2"/>

  <g id="fanhub">
    <circle cx="340" cy="110" r="60" fill="none" stroke="var(--t)" stroke-width="1" opacity=".3"/>
    <g class="fan-blades" id="blades">
      <ellipse cx="340" cy="70" rx="14" ry="34" fill="#888780" opacity=".7"/>
      <ellipse cx="375" cy="135" rx="14" ry="34" fill="#888780" opacity=".7" transform="rotate(120 375 135)"/>
      <ellipse cx="305" cy="135" rx="14" ry="34" fill="#888780" opacity=".7" transform="rotate(240 305 135)"/>
    </g>
    <circle cx="340" cy="110" r="10" fill="var(--t)" opacity=".6"/>
  </g>
  <text class="ts" x="340" y="190" text-anchor="middle">BLDC fan</text>

  <line x1="270" y1="100" x2="340" y2="100" stroke="#EF9F27" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>

  <text class="th" x="430" y="250">Duty cycle</text>
  <text class="ts" x="430" y="268" id="duty-readout">50% high, 50% low — half speed</text>
</svg>
<div style="display:flex;align-items:center;gap:12px;margin:10px 0 0;font-size:13px;color:var(--color-text-secondary)">
  <span style="min-width:60px">analogWrite</span>
  <input type="range" min="0" max="255" value="128" id="pwmslider" style="flex:1" oninput="updatePWM(+this.value)">
  <span id="valout" style="min-width:60px;text-align:right">128 / 255</span>
</div>
<script>
function updatePWM(v){
  const duty = Math.round(v/255*100);
  document.getElementById('valout').textContent = v + ' / 255';
  let label;
  if(duty===0) label='0% high — fan off';
  else if(duty>=98) label='100% high — full speed';
  else label = duty + '% high, ' + (100-duty) + '% low — ' + duty + '% speed';
  document.getElementById('duty-readout').textContent = label;
  const period = 70;
  const high = Math.max(2, Math.round(period * duty/100));
  const low = period - high;
  let x = 40, d = 'M40,48';
  for(let i=0;i<3;i++){
    if(high>0){ d += ' L'+(x+high)+',48'; x+=high; }
    d += ' L'+x+',98';
    if(low>0){ d += ' L'+(x+low)+',98'; x+=low; }
    d += ' L'+x+',48';
  }
  document.getElementById('pwmpath').setAttribute('d', d);
  const spinDur = v===0 ? '0s' : (2.2 - (v/255)*1.8).toFixed(2)+'s';
  const blades = document.getElementById('blades');
  if(v===0){ blades.style.animation='none'; } else { blades.style.animation = 'spin '+spinDur+' linear infinite'; }
}
updatePWM(128);
</script>
